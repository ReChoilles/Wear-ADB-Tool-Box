name: Build Windows

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build (MSI / ZIP / Uber Jar)
        shell: pwsh
        run: |
          .\gradlew.bat packageDistributionForCurrentOS packageUberJarForCurrentOS --stacktrace --no-daemon 2>&1 | Tee-Object -FilePath build-log.txt
          exit $LASTEXITCODE

      - name: Error summary
        if: failure()
        shell: pwsh
        run: |
          "# 构建失败摘要" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Select-String -Path build-log.txt -Pattern "^\s*(e: |error:?|FAILURE:|Caused by:)" |
            Select-Object -First 150 | ForEach-Object { $_.Line } |
            Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if (Test-Path "build/compose/logs") {
            Get-ChildItem "build/compose/logs" -Recurse -File | ForEach-Object {
              "===== jpackage/tool log: $($_.FullName.Replace((Get-Location).Path,'')) =====" | Out-File build-log.txt -Append -Encoding utf8
              Get-Content $_.FullName -ErrorAction SilentlyContinue | Select-Object -First 100 | Out-File build-log.txt -Append -Encoding utf8
            }
          }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
          if-no-files-found: ignore

      - name: Upload distributions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-distributions
          path: |
            build/compose/binaries/main/**/*.msi
            build/compose/binaries/main/**/*.zip
            build/compose/jars/*.jar
          if-no-files-found: ignore
